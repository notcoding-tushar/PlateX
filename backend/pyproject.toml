[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hosnt12-fea"
version = "0.1.0"
description = "HOSNT12 Higher-Order Shear Deformation Theory FEA solver with IRC pavement/bridge adapters"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
hosnt12 = "hosnt12.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hosnt12*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["hosnt12/irc/irc_fea_library.py"]
